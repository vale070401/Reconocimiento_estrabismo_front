version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - npm install -g expo-cli@latest
        - npm ci
    build:
      commands:
        - npm run export
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .expo/**/*
      - .expo/web/**/*
